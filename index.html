//  CRASHLANDERS  v0.9

//  • Double jump is a 50c upgrade (single jump by default)

// Scale canvas to fill window at native pixel density
let DPR=1, SCALE=1;
function resize(){
  DPR = window.devicePixelRatio||1;
  SCALE = Math.min(window.innerWidth/IW, window.innerHeight/IH);
  // Canvas physical pixels = game pixels × scale × DPR
  C.width  = Math.round(IW*SCALE*DPR);
  C.height = Math.round(IH*SCALE*DPR);
  C.style.width  = Math.round(IW*SCALE)+'px';
  C.style.height = Math.round(IH*SCALE)+'px';
}
window.addEventListener('resize',resize); resize();

// ── HSL ──────────────────────────────────────────────────
function hsl(h,s,l){
  h=((h%360)+360)%360; s/=100; l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{ const k=(n+h/30)%12; const c=l-a*Math.max(Math.min(k-3,9-k,1),-1); return Math.round(255*c).toString(16).padStart(2,'0'); };
  return `#${f(0)}${f(8)}${f(4)}`;
}

// ══════════════════════════════════════════════════════════
//  SID-STYLE AUDIO ENGINE  (Web Audio API, C64 inspired)
// ══════════════════════════════════════════════════════════
let AC=null, masterGain=null;
let musicPlaying=false, musicTimer=null, musicStep=0, musicNextTime=0;
const BPM=90, S16=60/BPM/4;  // 16th note at 90 BPM = 0.1667s
const LOOK=0.25;

const N={
  C2:65.41, D2:73.42, E2:82.41, F2:87.31, G2:98, A2:110, Bb2:116.54, B2:123.47,
  C3:130.81, D3:146.83, Eb3:155.56, E3:164.81, F3:174.61, G3:196, Ab3:207.65, A3:220, Bb3:233.08, B3:246.94,
  C4:261.63, D4:293.66, Eb4:311.13, E4:329.63, F4:349.23, G4:392, Ab4:415.3, A4:440, Bb4:466.16, B4:493.88,
  C5:523.25, D5:587.33, Eb5:622.25, E5:659.25, F5:698.46, G5:784, A5:880
};

// ── FUGUE engine ──────────────────────────────────────
// Semitone offset → Hz
const st=(root,s)=>root*Math.pow(2,s/12);

// Fugue subject (16 steps, semitone offsets from root; null = sustain/rest)
// Dramatic descending C-minor subject: leap up a fifth then stepwise descent
const FSUB=[0,null,7,3,0,-2,-4,null,-5,-7,-9,-12,null,null,0,7];
// Countersubject (16 steps) — rising line played by earlier voices
const FCTR=[12,14,15,17,null,15,14,12,null,10,9,7,5,null,3,0];
// Bass pedal roots (one note sustained per 16-step section)
const FBAS=[N.C2, 55, N.D2, N.E2]; // C2, A1(55Hz), D2, E2
// Subject entry roots: C3, A2, D3, E3
const FROOT=[N.C3, N.A2, N.D3, N.E3];
// 64-step loop (4 bars × 16 steps)

// Play a note with N harmonics (natural harmonic series: f, 2f, 3f... at 1/h amplitude)
function playHarm(freq,harmonics,vol,t,dur){
  if(!AC||freq<=0) return;
  const types=['sawtooth','square','triangle','square'];
  for(let h=1;h<=harmonics;h++){
    const hf=freq*h, hv=vol/Math.sqrt(h);
    tone(hf,types[h-1],hv,.003,.03,.6,.05,dur,t,3500/h);
  }
}

function schedMusic(){
  if(!musicPlaying||!AC) return;
  NET.inMusic=true;
  while(musicNextTime<AC.currentTime+LOOK){
    const step=musicStep%64, t=musicNextTime;
    const sec=Math.floor(step/16);  // which section (0-3)
    const ss=step%16;               // step within section

    // ── Bass pedal: sustained root, re-triggered each section ──
    if(ss===0){
      tone(FBAS[sec],'sawtooth',.18,.01,.05,.8,.12,S16*15.4,t,400);
      // Fifth above for power-chord heaviness
      tone(FBAS[sec]*1.5,'sawtooth',.08,.005,.05,.6,.1,S16*7.5,t,500);
    }

    // ── Active voice: plays subject in its key with sec+1 harmonics ──
    const subInt=FSUB[ss];
    if(subInt!==null){
      const freq=st(FROOT[sec],subInt);
      playHarm(freq, sec+1, .095-sec*.008, t, S16*.88);
    }

    // ── Earlier voices: play countersubject (one per previous section) ──
    for(let v=0;v<sec;v++){
      // Stagger each counter voice by 4 steps for contrapuntal texture
      const cStep=(ss+v*4)%16;
      const cInt=FCTR[cStep];
      if(cInt!==null){
        const cFreq=st(FROOT[v], cInt-12); // countersubject an octave up from subject
        playHarm(cFreq, v+1, .055-v*.008, t, S16*.75);
      }
    }

    // ── Rhythmic percussion ──
    if(ss===0||ss===8) nz(.05+sec*.008,.05,t,160);     // downbeat thud
    if(ss===4||ss===12) nz(.025,.025,t,2200);           // backbeat snap
    // Extra tension pulse on beat 3 of full bars (step 8)
    if(ss===8&&sec>=2) nz(.04,.08,t,80,'lowpass');

    musicStep++; musicNextTime+=S16;
  }
  NET.inMusic=false;
  musicTimer=setTimeout(schedMusic,80);
}
function startMenuMusic(){
  if(musicPlaying||!AC) return;
  musicPlaying=true; musicStep=0; musicNextTime=AC.currentTime+.05;
  schedMusic();
}
function stopMusic(){
  musicPlaying=false;
  if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; }
}

function initAudio(){
  if(AC) return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain(); masterGain.gain.value=0.4;
    masterGain.connect(AC.destination);
  }catch(e){}
}
function resumeAudio(){ if(AC&&AC.state==='suspended') AC.resume(); }

function tone(f,type,vol,a,d,sus,r,dur,t,fCut){
  if(!AC||!f||f<=0) return;
  t=t||AC.currentTime;
  const osc=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
  flt.type='lowpass'; flt.frequency.value=fCut||7000; flt.Q.value=fCut?2.5:.5;
  osc.type=type; osc.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+a);
  g.gain.linearRampToValueAtTime(vol*sus,t+a+d);
  g.gain.setValueAtTime(vol*sus,t+Math.max(t+a+d,t+dur-.001)-t);
  g.gain.linearRampToValueAtTime(0,t+dur+r);
  osc.connect(flt); flt.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+dur+r+.02);
}
function sweep(f0,f1,type,vol,dur,t){
  if(!AC) return; t=t||AC.currentTime;
  const osc=AC.createOscillator(), g=AC.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(f0,t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(f1,10),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.linearRampToValueAtTime(0,t+dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+dur+.02);
}
function nz(vol,dur,t,fCut,fType){
  if(!AC) return; t=t||AC.currentTime;
  const len=Math.ceil(AC.sampleRate*.5), buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const flt=AC.createBiquadFilter(); flt.type=fType||'bandpass';
  flt.frequency.value=fCut||500; flt.Q.value=.8;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(flt); flt.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+dur+.02);
}

// ── MAP ──────────────────────────────────────────────────
const TW=16, TH=16, MW=50, MH=28;
let map, tileHP, tileKind, dustPiles, pendingPlatforms=[];   // tileKind 1 = ship-hull debris
const TILE_MAX_HP=3, DUST_MAX=TH*5;
const FLOOR_PX=()=>(MH-2)*TH;

function initBaseMap(){
  map    = Array.from({length:MH},()=>new Uint8Array(MW));
  tileHP = Array.from({length:MH},()=>new Uint8Array(MW));
  tileKind = Array.from({length:MH},()=>new Uint8Array(MW));
  dustPiles = new Float32Array(MW);
  for(let x=0;x<MW;x++){ map[MH-1][x]=1; map[MH-2][x]=1; }
  for(let y=0;y<MH;y++){ map[y][0]=1; map[y][MW-1]=1; }
  for(let x=0;x<MW;x++) map[0][x]=1;
  genRandomPlatforms();
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) if(map[y][x]) tileHP[y][x]=TILE_MAX_HP;
}
// Plan where the wreckage will land; the tiles appear when each piece hits (see uCinCrash)
function genRandomPlatforms(){
  pendingPlatforms=[];
  const add=(tx,ty,tw)=>{ tw=Math.min(tw,MW-1-tx); if(tw>=2) pendingPlatforms.push({tx,ty,tw}); };
  const count=10+rnd(0,6);
  for(let i=0;i<count;i++) add(rnd(2,MW-8),rnd(5,MH-5),rnd(3,9));
  for(const [a,b] of [[2,8],[MW-10,MW-2]]) for(let r=0;r<3;r++) add(rnd(a,b),rnd(6,MH-4),rnd(3,6));
}
function setTile(tx,ty,v,kind=0){ if(tx<0||tx>=MW||ty<0||ty>=MH)return; NET.mapDirty=true; map[ty][tx]=v; tileHP[ty][tx]=v?TILE_MAX_HP:0; tileKind[ty][tx]=v?kind:0; }
function damageTile(tx,ty){
  if(tx<=0||tx>=MW-1||ty<=0||ty>=MH-2) return;
  if(!map[ty][tx]) return;
  tileHP[ty][tx]--; NET.mapDirty=true;
  const px=tx*TW+TW/2, py=ty*TH+TH/2;
  if(tileHP[ty][tx]<=0){
    map[ty][tx]=0; tileHP[ty][tx]=0; tileKind[ty][tx]=0;
    for(let d=-2;d<=2;d++){
      const dtx=tx+d; if(dtx<0||dtx>=MW) continue;
      dustPiles[dtx]=Math.min(DUST_MAX,dustPiles[dtx]+TH*(1.1-Math.abs(d)*0.3));
    }
    for(let i=0;i<18;i++){
      const a=Math.random()*Math.PI*2,s=Math.random()*4+0.5;
      particles.push({x:px+rnd(-6,6),y:py+rnd(-4,4),vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:rnd(18,45),col:Math.random()<0.5?lvl.dust:lvl.dustT,size:rnd(1,4)});
    }
  } else {
    for(let i=0;i<4;i++){
      const a=Math.random()*Math.PI*2,s=Math.random()*2;
      particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(6,16),col:lvl.crack2,size:1});
    }
  }
}
function pushDust(bx,bw){
  const tx0=Math.floor(bx/TW), tx1=Math.floor((bx+bw)/TW);
  for(let tx=tx0;tx<=tx1;tx++){
    if(tx<0||tx>=MW) continue;
    const push=Math.min(dustPiles[tx],TH*0.18);
    dustPiles[tx]-=push;
    if(tx>0)    dustPiles[tx-1]=Math.min(DUST_MAX,dustPiles[tx-1]+push*0.4);
    if(tx<MW-1) dustPiles[tx+1]=Math.min(DUST_MAX,dustPiles[tx+1]+push*0.4);
  }
}
function dustSurfaceUnder(bx,bw){
  const fy=FLOOR_PX();
  const tx0=Math.max(0,Math.floor(bx/TW)), tx1=Math.min(MW-1,Math.floor((bx+bw-1)/TW));
  let minSurf=fy;
  for(let tx=tx0;tx<=tx1;tx++) if(dustPiles[tx]>2) minSurf=Math.min(minSurf,fy-dustPiles[tx]);
  return minSurf;
}
function solid(tx,ty){ if(tx<0||tx>=MW||ty<0||ty>=MH) return true; return map[ty][tx]===1; }
function isHardSolid(tx,ty){ return tx<=0||tx>=MW-1||ty>=MH-2||ty<=0; }
function solidFull(tx,ty){ if(tx<0||tx>=MW||ty<0||ty>=MH) return true; if(!map[ty][tx]) return false; return isHardSolid(tx,ty); }
function solidOneWayTop(tx,ty){ if(tx<0||tx>=MW||ty<0||ty>=MH) return false; return map[ty][tx]===1&&!isHardSolid(tx,ty); }

// ── PHYSICS ──────────────────────────────────────────────
class Body{
  constructor(x,y,w,h){ this.x=x;this.y=y;this.w=w;this.h=h;this.vx=0;this.vy=0;this.onGround=false;this.dropT=0; }
  step(grav=0.45){
    // Terminal velocity < TH so nothing tunnels through a tile in one frame
    this.vy=Math.min(this.vy+grav,TH-1);
    this.x+=this.vx; this._rx();
    const prevB=this.y+this.h;
    this.y+=this.vy; this.onGround=false; this._ry(prevB);
    if(this.dropT>0) this.dropT--;
  }
  _rx(){
    const l=this.x,r=this.x+this.w-1,t=this.y+4,b=this.y+this.h-5;
    const hd=(px,py)=>solidFull(Math.floor(px/TW),Math.floor(py/TH));
    if(hd(l,t)||hd(l,b)){this.x=(Math.floor(l/TW)+1)*TW;this.vx=0;}
    if(hd(r,t)||hd(r,b)){this.x=Math.floor(r/TW)*TW-this.w;this.vx=0;}
  }
  _ry(prevB){
    const l=this.x+2,r=this.x+this.w-3;
    const hd=(px,py)=>solidFull(Math.floor(px/TW),Math.floor(py/TH));
    if(hd(l,this.y)||hd(r,this.y)){this.y=(Math.floor(this.y/TH)+1)*TH;if(this.vy<0)this.vy=0;}
    if(this.vy<0) return;
    // Land only on tile tops the feet actually crossed this frame (true one-way platforms).
    // The old check snapped to any tile overlapping the bottom pixel, so on platforms
    // onGround flickered every other frame and bodies rising through a platform got teleported up.
    const tl=Math.floor(l/TW), tr=Math.floor(r/TW);
    const B=this.y+this.h;
    const ty0=Math.ceil((prevB-0.01)/TH), ty1=Math.floor(B/TH);
    for(let ty=ty0;ty<=ty1;ty++){
      const hard=solidFull(tl,ty)||solidFull(tr,ty);
      const oneWay=this.dropT<=0&&(solidOneWayTop(tl,ty)||solidOneWayTop(tr,ty));
      if(hard||oneWay){ this.y=ty*TH-this.h; this.onGround=true; this.vy=0; return; }
    }
    // Safety: feet embedded in the indestructible floor → push out
    const bot=this.y+this.h-1;
    if(hd(l,bot)||hd(r,bot)){ this.y=Math.floor(bot/TH)*TH-this.h; this.onGround=true; this.vy=0; }
  }
  standingOnOneWay(){
    const ty=Math.floor((this.y+this.h)/TH);
    return solidOneWayTop(Math.floor((this.x+2)/TW),ty)||solidOneWayTop(Math.floor((this.x+this.w-3)/TW),ty);
  }
  hits(o){ return this.x<o.x+o.w&&this.x+this.w>o.x&&this.y<o.y+o.h&&this.y+this.h>o.y; }
}
function checkDustLanding(p){
  if(p.vy<0) return;
  const surf=dustSurfaceUnder(p.x,p.w);
  if(p.y+p.h>surf&&p.y+p.h-p.vy<=surf+10){ p.y=surf-p.h; p.vy=0; p.onGround=true; }
}

// ── CONTROLS ─────────────────────────────────────────────
const CTRL=[
  // P1: arrows + AltGr/ShiftDir (saltar) + CtrlDir (disparar) | store: Z X C V
  {left:'ArrowLeft',right:'ArrowRight',aimUp:'ArrowUp',aimDown:'ArrowDown',
   jump:['AltRight','ShiftRight'], shoot:'ControlRight',
   b1:'KeyZ', b2:'KeyX', b3:'KeyC', b4:'KeyV'},
  // P2: WASD + 1/Espaço (saltar) + Q (disparar) | store: G H J K
  {left:'KeyA',right:'KeyD',aimUp:'KeyW',aimDown:'KeyS',
   jump:['Digit1','Space'], shoot:'KeyQ',

// Each boss is assembled from 7 slots on a 15×16 grid of 4px blocks.
// Parts store only the left half (8 cols, col 7 = centre) and are mirrored.
// Cell codes: o outline, d shadow, m base, l light, s specular, a accent glow,
// e eye, p pupil, w bone/teeth, f flame (flickers). '.' = empty.
const BCELL=4, BFW=15, BFH=16;
const BOSS_PARTS={

  head:[{id:'chifres',y:0,h:[".o......",".wo.....","..wo....","..ww....","...w...."]},
        {id:'crista',y:0,h:[".......o","......ol","......om",".....oam",".....omm"]},
        {id:'cupula',y:1,h:["....oooo","...oaaal","..oaasaa","..oaaaaa"]}],

        {id:'gemeos',y:5,h:["..oo....","..oeeo..","..oepeo.","...oooo."]},

  mouth:[{id:'presas',y:9,h:["...ooooo","...wowow","....w..."]},

const BOSS_ORDER=['back','legs','body','arms','head','eyes','mouth'];
const BOSS_BOB=new Set(['back','body','arms','head','eyes','mouth']);
const BNAME_A={carapaca:'KRA',saco:'GLO',blindado:'VOR'};
const BNAME_B={ciclope:'MOX',gemeos:'ZIK',composto:'THUL'};
const BNAME_C={bipede:'O ESMAGADOR',aranha:'O RASTEJANTE',jatos:'O FLUTUANTE'};
const mirrorRow=r=>{ r=(r+'........').slice(0,8); return r+r.slice(0,7).split('').reverse().join(''); };
let nextBossParts=null;   // this level's boss, rolled at level start (the intro scans it)
function rollBossParts(){
  const sel={};
  for(const s of BOSS_ORDER){ const a=BOSS_PARTS[s]; sel[s]=a[rnd(0,a.length)]; }
  return sel;
}
function bossName(parts){ return `${BNAME_A[parts.body.id]}'${BNAME_B[parts.eyes.id]} ${BNAME_C[parts.legs.id]}`; }
// Build the cell grid for the current frame (bob, blink, open mouth, pupils toward facing)
function composeBoss(parts,bob,blink,mouthOpen,facing){
  const g=Array.from({length:BFH+1},()=>Array(BFW).fill('.'));
  for(const s of BOSS_ORDER){
    const p=parts[s]; if(!p) continue;
    const dy=(BOSS_BOB.has(s)?bob:0)+(s==='mouth'&&mouthOpen?1:0);
    p.h.forEach((r,i)=>{
      const f=mirrorRow(r), y=p.y+i+dy; if(y<0||y>BFH) return;
      for(let x=0;x<BFW;x++){
        let c=f[x]; if(c==='.') continue;
        if(s==='eyes'&&blink&&(c==='e'||c==='p')) c='d';
        g[y][x]=c;
      }
    });
  }
  // Pupils look toward the target: shift each pupil one cell if there's eye white there
  if(!blink&&facing) for(const row of g){
    const src=row.slice();
    for(let x=0;x<BFW;x++) if(src[x]==='p'){
      const nx=x+facing;
      if(nx>=0&&nx<BFW&&src[nx]==='e'){ row[nx]='p'; if(src[x-facing]!=='p') row[x]='e'; }
    }
  }
  return g;
}
// The 15×16 design grid is upscaled twice with EPX (Scale2x) to 60×64 — smooth
// diagonals at the same 1-pixel density as the player and the tiles — and baked
// into an offscreen canvas, so there are no seams between cells.
function epx(g){
  const h=g.length, w=g[0].length, o=Array.from({length:h*2},()=>Array(w*2));
  const at=(y,x)=>(y<0||y>=h||x<0||x>=w)?'.':g[y][x];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const P=g[y][x], A=at(y-1,x), B=at(y,x+1), C=at(y,x-1), D=at(y+1,x);
    let p1=P,p2=P,p3=P,p4=P;
    if(C===A&&C!==D&&A!==B) p1=A;
    if(A===B&&A!==C&&B!==D) p2=B;
    if(D===C&&D!==B&&C!==A) p3=C;
    if(B===D&&B!==A&&D!==C) p4=D;
    o[2*y][2*x]=p1; o[2*y][2*x+1]=p2; o[2*y+1][2*x]=p3; o[2*y+1][2*x+1]=p4;
  }
  return o;
}
const bossSpriteCache=new Map();
function bossSprite(g,pal,key){
  let c=bossSpriteCache.get(key); if(c) return c;
  if(bossSpriteCache.size>96) bossSpriteCache.clear();
  const g4=epx(epx(g)), h=g4.length, w=g4[0].length;
  c=document.createElement('canvas'); c.width=w; c.height=h;
  const cx=c.getContext('2d'), img=cx.createImageData(w,h), rgb={};
  for(const k in pal){ const n=parseInt(pal[k].slice(1),16); rgb[k]=[n>>16&255,n>>8&255,n&255]; }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const v=g4[y][x]; if(v==='.'||!rgb[v]) continue;
    const i=(y*w+x)*4, q=rgb[v]; img.data[i]=q[0]; img.data[i+1]=q[1]; img.data[i+2]=q[2]; img.data[i+3]=255;
  }
  cx.putImageData(img,0,0); bossSpriteCache.set(key,c);
  return c;
}
function bossPalette(mode){
  const h=lvl.bossHue;
  if(mode==='flash') return {o:'#ffffff',d:'#ffffff',m:'#ffffff',l:'#ffffff',s:'#ffffff',a:'#ffffff',e:'#ffffff',p:'#ffffff',w:'#ffffff',f:'#ffffff'};
  const k=mode==='bright'?14:0;
  const P={o:hsl(h,50,8),d:hsl(h,60,24+k),m:hsl(h,60,42+k),l:hsl(h,65,62+k),s:hsl(h,40,86),
           a:hsl(h+180,95,60),e:hsl(h+180,90,72),p:'#1a0008',w:hsl(45,35,82),f:'#ffb020'};
  if(mode==='burst'){ P.d='#600000'; P.m='#d01010'; P.l='#ff5040'; P.e='#ffffff'; P.p='#ff0000'; P.a='#ff3020'; }
  return P;
}

//  ONLINE CO-OP — host-authoritative over Supabase Realtime broadcast.
//  The host simulates everything; the guest only sends its buttons and

// ═══════════════════════════════════════════════════════
const NET={mode:null,ch:null,code:'',peer:false,started:false,status:'',lost:false,
  remote:{},remotePrev:{},events:[],mapDirty:true,inMusic:false,
  lastIn:'',lastInF:0,lastSnapT:0,lobby:'choose',sel:0,typed:'',err:''};
const NET_ACTIONS=['left','right','aimUp','aimDown','jump','shoot','b1','b2','b3','b4'];
const ROOM_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let sbClient=null;
function sbc(){
  if(!window.supabase) return null;
  if(!sbClient) sbClient=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:60}}});
  return sbClient;
}
// Player input: local keys, or the guest's buttons for the remote player on the host
function pin(p,a){ return p.remote?!!NET.remote[a]:kd(p.ctrl[a]); }
function pjp(p,a){
  if(p.remote) return !!NET.remote[a]&&!NET.remotePrev[a];
  const c=p.ctrl[a]; return Array.isArray(c)?c.some(jp):jp(c);
}

function openLobby(){ Object.assign(NET,{lobby:'choose',sel:0,typed:'',err:''}); gState='LOBBY'; }
function netJoin(code,asHost){
  const sb=sbc();
  if(!sb){ NET.err='Sem ligação ao servidor (Supabase não carregou)'; return; }
  netLeave();
  Object.assign(NET,{mode:asHost?'host':'guest',code,peer:false,started:false,lost:false,remote:{},remotePrev:{},
    events:[],mapDirty:true,status:'A ligar…',lobby:'wait',err:''});
  if(!asHost){ initLevel(true); gState='LOBBY'; }
  const me=NET.mode+'-'+Math.random().toString(36).slice(2,8);
  const ch=sb.channel('crashlanders-'+code,{config:{broadcast:{self:false,ack:false},presence:{key:me}}});
  ch.on('broadcast',{event:'in'},({payload})=>{ if(NET.mode==='host') NET.remote=payload.k||{}; })
    .on('broadcast',{event:'snap'},({payload})=>{ if(NET.mode==='guest') netApplySnap(payload); })
    .on('presence',{event:'sync'},()=>{
      if(!NET.mode) return;
      const other=Object.keys(ch.presenceState()).some(k=>!k.startsWith(NET.mode+'-'));
      if(other&&!NET.peer){ NET.peer=true; NET.lost=false; netPeerJoined(); }
      else if(!other&&NET.peer){ NET.peer=false; NET.remote={}; if(NET.started) NET.lost=true; }
    })
    .subscribe(async st=>{
      if(st==='SUBSCRIBED'){ await ch.track({at:Date.now()}); if(!NET.peer) NET.status=asHost?'À espera do 2.º jogador…':'À espera do anfitrião…'; }
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ NET.status='Erro de ligação ('+st+')'; }
    });
  NET.ch=ch;
}
function netLeave(){
  if(NET.ch){ try{ NET.ch.untrack(); sbc().removeChannel(NET.ch); }catch(e){} }
  Object.assign(NET,{ch:null,mode:null,peer:false,started:false,lost:false,remote:{},remotePrev:{},events:[]});
  for(const p of players) p.remote=false;
}
function netPeerJoined(){
  if(NET.mode==='host'){
    // fresh co-op run; the local single-player save is left untouched
    NET.started=true; numPlayers=2; levelNum=1;
    persist=[{weaponLvl:0,coins:0,fireRate:false,doubleJump:false,parachute:false},{weaponLvl:0,coins:0,fireRate:false,doubleJump:false,parachute:false}];

  } else NET.status='Ligado! À espera do jogo…';
}

// ── Host → guest snapshot ──
const r2=v=>typeof v==='number'?Math.round(v*100)/100:v;
function pack(o,keys){ const r={}; for(const k of keys) r[k]=r2(o[k]); return r; }
const NET_PK=['x','y','vx','vy','hp','maxHP','facing','aimAngle','iframes','onGround','coins','weaponLvl','fireRate','doubleJump','parachute','dmgMult','airJumps','reviveTimer','jh','sh','shootCD','boarded'];
const NET_BK=['x','y','vx','vy','hp','facing','state','burstState','burstWindup','burstTimer','flash','laserT','laserAng','mouthT','rising','hitCounter','dmgDropped','onGround','name','legs','arms','eyes'];
function netEncodeMap(){
  let s=''; for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) s+=map[y][x]?String.fromCharCode(65+tileHP[y][x]*2+tileKind[y][x]):'.';
  return s;
}
function netDecodeMap(s){
  let i=0;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const c=s.charCodeAt(i++);
    if(c===46){ map[y][x]=0; tileHP[y][x]=0; tileKind[y][x]=0; }
    else { const v=c-65; map[y][x]=1; tileHP[y][x]=v>>1; tileKind[y][x]=v&1; }
  }
}
function netSnap(){
  const s={src:'web',g:gState,f:gFrame,lv:levelNum,np:numPlayers,sh:shake,ct:cinT,gh:lvl.groundHue,bh:lvl.bossHue,
    pl:players.map(p=>pack(p,NET_PK)),
    pb:pBullets.map(b=>pack(b,['x','y','vx','vy','pid'])),
    bb:bBullets.map(b=>pack(b,['x','y','vx','vy','r','burst'])),
    dr:drops.map(d=>pack(d,['x','y','type','bob'])),
    ev:NET.events};
  NET.events=[];
  if(bossSpawned&&boss){ s.bo=pack(boss,NET_BK); s.bo.pid=BOSS_ORDER.map(k=>boss.parts[k].id); }
  if(gState==='CIN_SPACE'||gState==='CIN_ORBIT'||gState==='CIN_CRASH'){
    s.cs=cs; s.cshots=cShots; s.planet=planet; s.crashDone=crashDone;
    if(nextBossParts) s.nbp=BOSS_ORDER.map(k=>nextBossParts[k].id);
    s.debris=debris.map(d=>pack(d,['x','y','w','h','angle','t','landed']));
  }
  if(gState==='EXTRACT'&&extractShip){ s.es=extractShip; s.et=extractTimer; }
  if(gState==='WARP'){ s.wt=warpTimer; s.st=storeTimer; }
  if(NET.mapDirty||gFrame%60===0){ s.map=netEncodeMap(); NET.mapDirty=false; }
  if(gFrame%6===0) s.dust=Array.from(dustPiles,v=>Math.round(v));
  return s;
}
function netHostTick(){
  if(!NET.ch||!NET.started){ NET.events=[]; return; }
  if(gState==='PLAY'&&Object.keys(NET.remote).length) anyMoved=true;
  NET.remotePrev={...NET.remote};
  if(NET.peer&&gFrame%2===0) NET.ch.send({type:'broadcast',event:'snap',payload:netSnap()});
  if(NET.lost&&jp('Enter')){ netLeave(); init(); }
}

// ── Guest side ──
function netApplySnap(s){
  NET.started=true; NET.lastSnapT=performance.now();
  gState=s.g; levelNum=s.lv; numPlayers=s.np; cinT=s.ct; gFrame=s.f; shake=Math.max(shake,s.sh);
  if(lvl.groundHue!==s.gh||lvl.bossHue!==s.bh) setLvlHues(s.gh,s.bh);
  s.pl.forEach((q,i)=>{
    let p=players[i];
    if(!p){ p=new Body(q.x,q.y,PW,PH); p.id=i; p.col=PCOLS[i]; p.ctrl=CTRL[i]; p.kbVx=0; p.aimElev=0; players[i]=p; }
    Object.assign(p,q);
  });
  players.length=s.pl.length;
  pBullets=s.pb; bBullets=s.bb; drops=s.dr;
  if(s.bo){
    if(!boss) boss=new Body(s.bo.x,s.bo.y,BW,BH);
    Object.assign(boss,s.bo); boss.parts={};
    BOSS_ORDER.forEach((k,i)=>boss.parts[k]=BOSS_PARTS[k].find(p=>p.id===s.bo.pid[i]));
    bossSpawned=true; if(musicPlaying) stopMusic();
  } else { boss=null; bossSpawned=false; }
  if(s.cs){ cs=s.cs; cShots=s.cshots; planet=s.planet; debris=s.debris; crashDone=s.crashDone; }
  if(s.nbp){ nextBossParts={}; BOSS_ORDER.forEach((k,i)=>nextBossParts[k]=BOSS_PARTS[k].find(p=>p.id===s.nbp[i])||BOSS_PARTS[k][0]); }
  if(s.es){ extractShip=s.es; extractTimer=s.et; }
  if(s.wt!==undefined){ warpTimer=s.wt; storeTimer=s.st; }
  if(s.map) netDecodeMap(s.map);
  if(s.dust) for(let i=0;i<MW;i++) dustPiles[i]=s.dust[i];
  for(const e of s.ev||[]){ if(e[0]==='p'){ if(s.src==='love') netPlayNamed(e[1]); } else netPlayEvent(e); }
}
function netGuestUpdate(){
  const k={}; for(const a of NET_ACTIONS) if(kd(CTRL[0][a])) k[a]=1;
  const sig=Object.keys(k).join(',');
  if(NET.ch&&(sig!==NET.lastIn||gFrame-NET.lastInF>15)){
    NET.ch.send({type:'broadcast',event:'in',payload:{k}}); NET.lastIn=sig; NET.lastInF=gFrame;
  }
  for(const b of pBullets){ b.x+=b.vx; b.y+=b.vy; }      // dead-reckon between snapshots
  for(const b of bBullets){ b.x+=b.vx; b.y+=b.vy; }
  for(const d of drops) d.bob+=.08;
  if(NET.started&&performance.now()-NET.lastSnapT>5000) NET.lost=true;
  if(jp('Escape')||(NET.lost&&jp('Enter'))){ netLeave(); stopMusic(); init(); }
}

// ── Mirror particles and sounds made by the host simulation ──
const NET_ORIG={fx, tone, sweep, nz};
const NET_TI={tone:8,sweep:5,nz:2};          // index of the absolute-time argument
fx=function(...a){
  if(NET.mode==='host'&&NET.started) NET.events.push(['f',...a.map(v=>typeof v==='number'?Math.round(v*10)/10:v)]);
  return NET_ORIG.fx(...a);
};
for(const name of ['tone','sweep','nz']){
  window[name]=function(...a){
    if(NET.mode==='host'&&NET.started&&!NET.inMusic&&AC){
      const b=a.slice(), ti=NET_TI[name]; b[ti]=b[ti]?b[ti]-AC.currentTime:0;
      NET.events.push(['s',name,...b]);
    }
    return NET_ORIG[name].apply(null,a);
  };
}
// Named sounds: the web host emits them next to the raw synth calls so LÖVE guests
// (which can't replay raw Web Audio) still hear everything; web guests play them only
// when the host is a LÖVE console.
const SND_NAME={sndShoot:'shoot',sndLand:'land',sndHit:'hit',sndBossHit:'bossHit',sndCoin:'coin',sndExplode:'explode',
  sndBurst:'burst',sndRevive:'revive',sndLevelEnd:'levelEnd',sndDeath:'death',sndPara:'para',sndLaser:'laser',
  sndThruster:'thruster',sndBossShoot:'bossShoot',sndBossJump:'bossJump',sndSlam:'slam',sndCharge:'charge',sndPickup:'pickup',sndJump:null};
const SND_ORIG={};
for(const fn in SND_NAME){
  SND_ORIG[fn]=window[fn];
  window[fn]=function(...a){
    if(NET.mode==='host'&&NET.started) NET.events.push(['p',fn==='sndJump'?(a[0]?'jumpAir':'jump'):SND_NAME[fn]]);
    return SND_ORIG[fn].apply(null,a);
  };
}
function netPlayNamed(name){
  if(name==='jump') return SND_ORIG.sndJump(false);
  if(name==='jumpAir') return SND_ORIG.sndJump(true);
  for(const fn in SND_NAME) if(SND_NAME[fn]===name) return SND_ORIG[fn]();
}
function netPlayEvent(e){
  if(e[0]==='f') NET_ORIG.fx(...e.slice(1));
  else if(e[0]==='s'&&AC){
    const name=e[1], a=e.slice(2), ti=NET_TI[name];
    a[ti]=AC.currentTime+Math.max(0,a[ti]||0);
    NET_ORIG[name](...a.map(v=>v===null?undefined:v));
  }
}

//  UPDATE
// ═══════════════════════════════════════════════════════
function update(){
  gFrame++;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
  if(shake>0) shake--;
  if(NET.mode==='guest'&&gState!=='LOBBY'){ netGuestUpdate(); justPressed.clear(); return; }
  if     (gState==='LOBBY')     uLobby();
  else if(gState==='MENU')      uMenu();
  else if(gState==='CIN_SPACE') uCinSpace();
  else if(gState==='CIN_ORBIT') uCinOrbit();
  else if(gState==='CIN_PAN')   uCinPan();
  else if(gState==='CIN_CRASH') uCinCrash();
  else if(gState==='PLAY')      uPlay();
  else if(gState==='EXTRACT')   uExtract();
  else if(gState==='WARP')      uWarp();
  else if(gState==='DEAD')      uDead();
  if(NET.mode==='host') netHostTick();
  justPressed.clear();
}

function uMenu(){
  startMenuMusic();
  const numOpts=hasSaveGame?4:3;
  if(jp('ArrowUp'))   { menuSel=Math.max(0,menuSel-1); sndMenuMove(); }
  if(jp('ArrowDown')) { menuSel=Math.min(numOpts-1,menuSel+1); sndMenuMove(); }
  if(jp('Enter')||jp('Space')||jp('KeyZ')){
    sndMenuConfirm();
    if(menuSel===numOpts-1){ openLobby(); return; }
    if(hasSaveGame && menuSel===0){
      // Resume saved game — restore palette then go to crash
      const savedLevel=levelNum, savedPlayers=numPlayers;
      initLevel(false);
      for(let i=1;i<savedLevel;i++) randomLvlPalette();
      numPlayers=savedPlayers;
    } else {
      // New game — index 0 (no save) or 1/2 (with save) = 1P/2P
      const np=hasSaveGame?menuSel:menuSel+1;
      resetPersist(); numPlayers=np;
      saveToLS(); startCin();
    }
  }
}
function startCin(){
  cinT=0; cShots=[];
  // Music continues playing through cinematic into gameplay
  cs={x:-80,y:H*.44,vx:3.5,vy:0,angle:0,av:0,scale:.7,
      exploding:false,explodeT:0,crashed:false,
      tumbleAv:0,tumbleAngle:0,drifting:false};
  gState='CIN_SPACE';
}

// ═══════════════════════════════════════════════════════
//  CIN_SPACE — single clean lateral plane, Flashback-style
//  Beat 1  (  0-80):  Enemy cruiser enters from right
//  Beat 2  ( 80-160): Our ship enters from left, laser 1 misses
//  Beat 3  (160-260): Laser 2, narrow dodge
//  Beat 4  (260-360): Laser 3 hits — tumbling + smoke
//  Beat 5  (360-460): Ship tumbles off screen → CUT to orbit
// ═══════════════════════════════════════════════════════
function uCinSpace(){
  cinT++;

  if(!cs.exploding){
    // ── Beat 1: our ship flies in, cruiser looms ─────────
    if(cinT<=80){
      cs.x=lerp(cs.x,W*.24,.045);   // glide in to a third of the screen
    }

    // ── Beat 2: laser 1 ───────────────────────────────────
    if(cinT===90){ cShots.push({id:1,x:W*.78,y:H*.44,vx:-32,alive:true}); sndLaser(); }
    if(cinT>90&&cinT<140){
      cs.y=lerp(cs.y,H*.28,.14);
      cs.angle=lerp(cs.angle,-.28,.1);
    }
    if(cinT>140&&cinT<180){
      cs.y=lerp(cs.y,H*.44,.1);
      cs.angle=lerp(cs.angle,0,.1);
    }

    // ── Beat 3: laser 2 ───────────────────────────────────
    if(cinT===190){ cShots.push({id:2,x:W*.78,y:H*.3,vx:-38,alive:true}); sndLaser(); }
    if(cinT>190&&cinT<240){
      cs.y=lerp(cs.y,H*.58,.16);
      cs.angle=lerp(cs.angle,.22,.1);
    }
    if(cinT>240&&cinT<270){
      cs.y=lerp(cs.y,H*.44,.1);
      cs.angle=lerp(cs.angle,0,.1);
    }

    // ── Beat 4: laser 3 — HITS ────────────────────────────
    if(cinT===280){ cShots.push({id:3,x:W*.78,y:H*.46,vx:-44,alive:true}); sndLaser(); }

    // Move all bolts
    for(const s of cShots){
      if(!s.alive) continue;
      s.x+=s.vx;
      // Hit check for shot 3
      if(s.id===3&&s.x<cs.x+52&&s.x>cs.x-10&&Math.abs(s.y-(cs.y+18))<20){
        s.alive=false;
        cs.exploding=true; cs.explodeT=0;
        cs.vx=-0.5; cs.vy=0.8;
        cs.tumbleAv=.08+Math.random()*.04;
        cs.tumbleAngle=cs.angle;
        fx(cs.x+30,cs.y+18,35,P.flame,7,4);
        fx(cs.x+30,cs.y+18,18,P.ship,4,3);
        fx(cs.x+30,cs.y+18,12,'#ffffff',6,2);
        sndExplode(); shake=30;
      }
      if(s.x<-60) s.alive=false;
    }
  }

  // ── Beat 5: tumbling drift after hit ─────────────────
  if(cs.exploding){
    cs.explodeT++;
    cs.x+=cs.vx; cs.y+=cs.vy;
    cs.vy+=.012;
    cs.tumbleAngle+=cs.tumbleAv;
    cs.tumbleAv*=.995; // spin slows slightly
    // Smoke + flame trail
    if(cs.explodeT%3===0){
      fx(cs.x+30+rnd(-8,8),cs.y+18+rnd(-6,6),2,P.flame,2,2);
      fx(cs.x+30,cs.y+18,1,P.gray,1.5,2);
    }
    // Cut to orbit after ship tumbles past screen edge or enough time
    if(cs.explodeT>120||(cs.y>H+40)){
      gState='CIN_ORBIT'; cinT=0;
      planet={x:W*.5,y:H+320,r:220};
      cs.x=W*.75; cs.y=H*.12; cs.scale=.5; cs.angle=.1;
      cs.exploding=false; cs.tumbleAngle=0;
    }
  }

  if(cinT>560&&!cs.exploding){ gState='CIN_ORBIT'; cinT=0; planet={x:W*.5,y:H+320,r:220}; }
}

// ═══════════════════════════════════════════════════════
//  CIN_ORBIT — cut to black → planet fills half screen → ship enters orbit
//  ~5s (300 frames)
// ═══════════════════════════════════════════════════════
function uCinOrbit(){
  cinT++;
  // Phase A (0-30): black hold (planet not visible yet)
  // Phase B (30+): planet rises fast to centre-bottom, fills lower half
  if(cinT>30){
    const targetY=H*.82; // planet centre sits low — fills lower half
    planet.y=lerp(planet.y,targetY,.055);
    planet.r=lerp(planet.r,240,.04);
  }
  // Ship: enters upper-right after frame 60, arcs into orbit
  if(cinT>60){
    const t=(cinT-60)/180;
    const orbitAngle=-Math.PI*.6 + t*Math.PI*.5;
    const orbitR=planet.r*.8;
    const tx=planet.x+Math.cos(orbitAngle)*orbitR-20;
    const ty=planet.y+Math.sin(orbitAngle)*orbitR-15;
    cs.x=lerp(cs.x,tx,.04); cs.y=lerp(cs.y,ty,.04);
    cs.angle=orbitAngle+Math.PI*.5;
    if(gFrame%5===0) fx(cs.x+16,cs.y+18,1,P.gray,1,2);
    // Damaged thruster sputter every ~0.5s
    if(cinT%30===0) sndThruster(.03);
  }
  if(cinT>300){ gState='CIN_CRASH'; cinT=0; initCrashEntry(); }
}

function initCrashEntry(){
  // Ship enters map from top-centre, already on fire, straight vertical fall
  const mapCentreX=W/2-28;
  cs={x:mapCentreX,y:-70,vx:0,vy:2.2,angle:.04,av:.005,scale:1,exploding:false,explodeT:0,crashed:false};
  crashDone=false; debris=[];
}

function uCinCrash(){
  cinT++;
  if(!crashDone){
    // Straight queda livre toward map centre
    cs.vy+=.09;                       // gravity
    cs.y+=cs.vy; cs.x+=cs.vx;
    cs.angle+=cs.av;
    // Smoke trail every 2 frames
    if(cinT%2===0){
      fx(cs.x+28+rnd(-6,6),cs.y+10,1,P.gray,1,2);
      fx(cs.x+28,cs.y+30,1,P.flame,2,2);
    }
    const sx=cs.x+28, sy=cs.y+40;
    const floorY=MH*TH-TH*2;
    if(sy>=floorY-8){
      crashDone=true; crashX=sx; crashY=floorY;
      cs.crashed=true; cs.vx=0; cs.vy=0; cs.y=floorY-50; cs.angle=rnd(-8,8)*.03;
      fx(sx,crashY,70,P.flame,10,4); fx(sx,crashY,40,P.ship,6,3); fx(sx,crashY,30,P.yellow,8,3);
      sndExplode();
      shake=50;
      const sx0=crashX, sy0=crashY-24, g=.38;
      const plan=pendingPlatforms.slice().sort((p,q)=>Math.abs(p.tx*TW-sx0)+Math.abs(p.ty*TH-sy0)-(Math.abs(q.tx*TW-sx0)+Math.abs(q.ty*TH-sy0)));
      plan.forEach((p,i)=>{
        const w=p.tw*TW, tx=p.tx*TW+w/2, ty=p.ty*TH+TH/2;
        const T=Math.round(clamp(30+Math.hypot(tx-sx0,ty-sy0)/8,34,72));
        const k=[-2,-1,1,2][rnd(0,4)];
        debris.push({plan:p,w,h:TH,T,t:-i*3,x:sx0,y:sy0,sx:sx0,sy:sy0,
          vx:(tx-sx0)/T, vy:(ty-sy0-g*T*(T+1)/2)/T, angle:0, av:k*Math.PI/T, landed:false});
      });
      pendingPlatforms=[];
    }
  }
  for(const d of debris){
    if(d.landed) continue;
    if(d.t<0){ d.t++; continue; }                  // staggered launches
    d.t++; d.vy+=.38; d.x+=d.vx; d.y+=d.vy; d.angle+=d.av;
    if(d.t%3===0){ fx(d.x,d.y,1,P.gray,1,2); if(Math.random()<.5) fx(d.x,d.y,1,P.flame,1.5,2); }
    if(d.t>=d.T){
      d.landed=true;
      const p=d.plan;
      for(let x=p.tx;x<p.tx+p.tw;x++) setTile(x,p.ty,1,1);
      fx(d.x,d.y,14,P.yellow,4,2); fx(d.x,d.y,10,P.ship,3,2);
      shake=Math.max(shake,5); sndLand();
    }
  }
  // Spawn players near wreck
  if(crashDone&&cinT>100&&players.length===0){
    const spx=clamp(crashX-40,TW+4,W-TW-PW*3-10);
    initPlayers(spx,MH*TH-TH*2-PH-4);
  }
  for(let x=1;x<MW-1;x++){ map[MH-1][x]=1; map[MH-2][x]=1; tileHP[MH-1][x]=TILE_MAX_HP; tileHP[MH-2][x]=TILE_MAX_HP; }
  if(crashDone&&cinT>180&&debris.every(d=>d.landed)){ gState='PLAY'; cinT=0; }
}

// uCinPan kept but bypassed (goes immediately to crash)
function uCinPan(){ gState='CIN_CRASH'; cinT=0; initCrashEntry(); }

// ── EXTRACT: boss drops ship, players auto-board, ship lifts ──
function uExtract(){
  extractTimer++;
  if(!extractShip) return;
  const es=extractShip;
  if(!es.landed){
    es.vy+=.25; es.y+=es.vy; es.angle+=es.av||0; if(es.av) es.av*=.92;
    const flr=MH*TH-TH*2-30;
    if(es.y>=flr){ es.y=flr; es.vy=0; es.landed=true; es.av=0; es.angle=0; fx(es.x+28,es.y+22,20,P.flame,4,3); shake=12; }
    return;
  }

  const targetX=es.x+28;
  let allBoarded=true;

  for(const p of players){
    if(p.boarded) continue;
    allBoarded=false;

    // Auto-walk — try to jump over obstacles every 60 frames if stuck
    const dir=targetX>p.x+PW/2?1:-1;
    p.vx=dir*2.5;
    // Jump if on ground and still far from ship (clears debris/platforms in the way)
    if(p.onGround&&Math.abs(p.x+PW/2-targetX)>30&&extractTimer%50===0){
      p.vy=PJMP*.8;
    }
    p.step(.45); checkDustLanding(p);
    p.x=clamp(p.x,TW+1,W-TW-PW-1);

    // Board if close enough (wider radius: 30px) OR timeout after 5s of trying
    const close=Math.abs(p.x+PW/2-targetX)<30;
    const timeout=extractTimer>300; // 5 seconds — force board even if stuck
    if(close||timeout){
      p.boarded=true;
      if(close) fx(p.x+PW/2,p.y,10,p.col.m,3,2);
    }
  }

  if(allBoarded&&extractTimer>60) es.lifting=true;

  if(es.lifting){
    es.vy=lerp(es.vy||0,-8,.06);
    es.y+=es.vy;
    if(gFrame%3===0) fx(es.x+rnd(10,46),es.y+45,2,P.flame,3,2);
    if(es.y<-100){
      // Bonus + level first, then save (bonus used to be lost unless you bought something)
      for(const p of players) p.coins+=20;
      levelNum++;
      saveToPersist();
      randomLvlPalette();
      warpTimer=0;
      warpStars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,len:rnd(4,30),spd:rnd(8,24)}));
      storeTimer=0;
      gState='WARP';
    }
  }
}

// ── WARP: speed-of-light transition → store overlay ──────
function uWarp(){
  warpTimer++;
  if(warpTimer===1) fetchLeaderboard(); // pre-fetch
  if(warpTimer>60) storeTimer++;
  const speed=Math.min(1,warpTimer/40);
  for(const s of warpStars){ s.x-=s.spd*speed; if(s.x<-s.len*speed) s.x=W+4; }
  if(storeTimer>60&&(jp('Enter')||jp('KeyR')||jp('KeyN'))){
    saveToLS(); initLevel(false);
  }
  if(storeTimer>60) uStoreBuy();
}

function uStoreBuy(){
  for(const p of players){
    if(pjp(p,'b1')&&p.coins>=COST_WEAPON&&p.weaponLvl<9){
      p.coins-=COST_WEAPON; p.weaponLvl++;
      persist[p.id].weaponLvl=p.weaponLvl; persist[p.id].coins=p.coins;
      fx(W/2,H/2,30,P.gold,6,3);
    }
    if(pjp(p,'b2')&&p.coins>=COST_FIRE&&!p.fireRate){
      p.coins-=COST_FIRE; p.fireRate=true;
      persist[p.id].fireRate=true; persist[p.id].coins=p.coins;
      fx(W/2,H/2,30,P.fire,6,3);
    }
    if(pjp(p,'b3')&&p.coins>=COST_DJUMP&&!p.doubleJump){
      p.coins-=COST_DJUMP; p.doubleJump=true;
      persist[p.id].doubleJump=true; persist[p.id].coins=p.coins;
      fx(W/2,H/2,30,P.djump,6,3);
    }
    if(pjp(p,'b4')&&p.coins>=COST_PARA&&!p.parachute){
      p.coins-=COST_PARA; p.parachute=true;
      persist[p.id].parachute=true; persist[p.id].coins=p.coins;
      fx(W/2,H/2,30,P.para,6,3);
    }
  }
}

// ── PLAY ─────────────────────────────────────────────────
const REVIVE_HP      = 30;  // HP given to dead player on revive
const REVIVE_COST    = 20;  // HP taken from reviver
const REVIVE_RANGE   = 14;  // pixel distance to trigger
const REVIVE_TIME    = 90;  // frames the reviver must stand near dead (1.5s)

function uPlay(){
  if(!bossSpawned){ if(anyMoved) bossCountdown--; if(bossCountdown<=0) spawnBoss(); }
  for(const p of players){
    if(p.hp>0) uPlayer(p);
    else       uDeadPlayer(p); // keep dead player physics running (gravity)
  }
  if(bossSpawned&&boss&&boss.hp>0) uBoss();

  // ── REVIVE CHECK (2 players only) ──────────────────────
  if(numPlayers===2){
    const [p0,p1]=players;
    // Check both directions: alive reviving dead
    for(const [alive,dead] of [[p0,p1],[p1,p0]]){
      if(alive.hp<=0||dead.hp>0) continue;
      const dist=Math.abs((alive.x+PW/2)-(dead.x+PW/2));
      if(dist<REVIVE_RANGE+PW&&Math.abs(alive.y-dead.y)<PH){
        // Start or advance revive timer
        dead.reviveTimer=(dead.reviveTimer||0)+1;
        if(dead.reviveTimer>=REVIVE_TIME){
          // Revive!
          dead.hp=REVIVE_HP;
          dead.iframes=120;
          dead.reviveTimer=0;
          // Cost to reviver
          alive.hp=Math.max(1, alive.hp-REVIVE_COST);
          fx(dead.x+PW/2,dead.y+PH/2, 20, dead.col.m, 5, 3);
          fx(dead.x+PW/2,dead.y+PH/2, 10, P.hpG,      3, 2);
          sndRevive();
          shake=Math.max(shake, 8);
        }
      } else {
        dead.reviveTimer=0;
      }
    }
  }

  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
    const tx=Math.floor(b.x/TW), ty=Math.floor(b.y/TH);
    if(b.life<=0){ fx(b.x,b.y,3,P.bullet,2,1); pBullets.splice(i,1); continue; }
    if(solid(tx,ty)){ damageTile(tx,ty); fx(b.x,b.y,3,P.bullet,2,1); pBullets.splice(i,1); }
  }
  for(let i=bBullets.length-1;i>=0;i--){
    const b=bBullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.wave){ b.t++; const k=Math.cos(b.t*.18)*1.8, sp=Math.hypot(b.vx,b.vy)||1; b.x+=-b.vy/sp*k; b.y+=b.vx/sp*k; }   // Tentáculos: sine weave
    if(b.life<=0||solid(Math.floor(b.x/TW),Math.floor(b.y/TH))) bBullets.splice(i,1);
  }
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.bob=(d.bob||0)+.08; d.step(.3);
    for(const p of players){
      if(p.hp>0&&d.hits(p)){ applyDrop(p,d.type); fx(d.x+6,d.y+6,14,dropCol(d.type),4,2); drops.splice(i,1); break; }
    }
  }
  if(bossSpawned&&boss&&boss.hp<=0&&gState==='PLAY'){
    sndLevelEnd(); sndExplode();
    const bcx=boss.x+BW/2;
    extractShip={x:bcx-28,y:boss.y-60,vy:2,av:0,landed:false,lifting:false};
    for(const p of players) p.boarded=false;
    extractTimer=0; gState='EXTRACT';
  }
  if(players.length>0&&players.every(p=>p.hp<=0)){
    sndDeath();
    gState='DEAD';
  }
}

// Dead player — apply gravity so they fall to floor, then stay there
function uDeadPlayer(p){
  // Keep simulating so the body falls if its platform gets shot away
  p.vx=0; p.kbVx=0; p.step(); checkDustLanding(p);
}

function uPlayer(p){
  const c=p.ctrl;
  const L=pin(p,'left'), R=pin(p,'right'), shootHeld=pin(p,'shoot'), jumpHeld=pin(p,'jump'), downHeld=pin(p,'aimDown');
  p.jh=jumpHeld; p.sh=shootHeld;
  // Movement (+ decaying knockback so hits actually push you)
  p.vx=(R?PSPD:0)-(L?PSPD:0)+p.kbVx;
  p.kbVx*=.82; if(Math.abs(p.kbVx)<.1) p.kbVx=0;
  // Facing follows movement; holding fire locks it (strafe: retreat while shooting)
  if(!shootHeld){ if(L&&!R) p.facing=-1; else if(R&&!L) p.facing=1; }
  // Up always raises the gun, down always lowers it, whichever way you face
  if(pin(p,'aimUp')) p.aimElev-=.08;
  if(downHeld)     p.aimElev+=.08;
  p.aimElev=clamp(p.aimElev,-Math.PI/2,Math.PI/2);
  p.aimAngle=p.facing>0?p.aimElev:Math.PI-p.aimElev;

  if(p.onGround){ p.coyote=6; p.airJumps=p.doubleJump?1:0; }
  else if(p.coyote>0) p.coyote--;

  const wasOnGround=p.onGround;
  const freshJump=jumpHeld&&!p.jumpPressed;
  // Jump buffer: a press shortly before landing still jumps
  if(freshJump) p.jumpBuf=7; else if(p.jumpBuf>0) p.jumpBuf--;
  if(p.jumpBuf>0){
    if(freshJump&&downHeld&&p.onGround&&p.standingOnOneWay()){
      p.dropT=10; p.y+=2; p.onGround=false; p.coyote=0; p.jumpBuf=0;   // ↓ + saltar: atravessa plataforma
    } else if(p.coyote>0){
      p.vy=PJMP; p.coyote=0; p.jumpBuf=0; sndJump(false);
    } else if(freshJump&&p.airJumps>0){
      p.vy=PJMP*.88; p.airJumps--; p.jumpBuf=0; fx(p.x+PW/2,p.y+PH,6,p.col.m,2,2); sndJump(true);
    }
  }
  p.jumpPressed=jumpHeld;
  if(!jumpHeld&&p.vy<-3) p.vy+=.8;

  // Parachute
  if(p.parachute&&jumpHeld&&p.vy>1.5&&!p.onGround){
    p.vy=lerp(p.vy,1.5,.18);
    if(gFrame%6===p.id){ fx(p.x+PW/2,p.y-2,1,P.para,1.5,2); if(gFrame%24===p.id*12) sndPara(); }
  }

  p.step(); checkDustLanding(p); p.x=clamp(p.x,TW+1,W-TW-PW-1);

  // Land sound — triggers once when first touching ground after being airborne
  if(p.onGround&&!wasOnGround&&p.vy===0) sndLand();

  p.shootCD--;
  if(shootHeld&&p.shootCD<=0){
    const pcx=p.x+PW/2, pcy=p.y+PH/2;
    const vx=Math.cos(p.aimAngle)*11, vy=Math.sin(p.aimAngle)*11;
    pBullets.push({x:pcx+vx*.5,y:pcy+vy*.5,vx,vy,life:70,pid:p.id,dmg:bulletDmg(p)});
    p.shootCD=shootCD(p);
    fx(pcx+vx*.9,pcy+vy*.9,2,p.dmgMult>1?P.dmgx:P.yellow,2,1);
    sndShoot();
  }

  if(p.iframes<=0){
    for(let i=bBullets.length-1;i>=0;i--){
      const b=bBullets[i];
      if(p.hits({x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2})){
        p.hp-=b.dmg||12; p.iframes=70; p.kbVx=(p.x<b.x?-1:1)*4; p.vy=-3;
        fx(p.x+PW/2,p.y+PH/2,8,p.col.m,3,2); bBullets.splice(i,1); sndHit();
      }
    }
    // Boss solid collision
    if(boss&&boss.hp>0&&p.hits(boss)){
      const ox=Math.min(p.x+p.w-boss.x, boss.x+BW-p.x);
      const oy=Math.min(p.y+p.h-boss.y, boss.y+BH-p.y);
      const pushLeft =p.x<boss.x+BW/2;

      if(ox<oy){
        // Horizontal push — check if wall is right there (corner trap)
        const wallLeft  = p.x<=TW+PW+2;
        const wallRight = p.x+p.w>=W-TW-PW-2;
        const trapped = (pushLeft&&wallLeft)||((!pushLeft)&&wallRight);

        if(trapped){
          // Escape upward instead of being pinned
          p.y=boss.y-p.h-1; p.vy=-4; p.onGround=false;
        } else {
          if(pushLeft){ p.x=boss.x-p.w; } else { p.x=boss.x+BW; }
          p.vx=0;
        }
        if(p.iframes<=0){
          const dir=pushLeft?-1:1;
          p.hp-=18*bossContactMul(); p.iframes=90; p.kbVx=dir*5; p.vy=-4;
          fx(p.x+PW/2,p.y+PH/2,10,P.orange,4,2); shake=Math.max(shake,8); sndHit();
        }
      } else {
        if(p.y+p.h/2<boss.y+BH/2){ p.y=boss.y-p.h; p.vy=0; p.onGround=true; }
        else { if(p.iframes<=0){ p.hp-=12*bossContactMul(); p.iframes=60; p.vy=2; fx(p.x+PW/2,p.y,6,P.orange,3,2); sndHit(); } p.y=boss.y+BH; p.vy=Math.max(p.vy,1); }
      }
    }
  } else p.iframes--;
  // God mode: never die
  if(godMode && p.hp<=0) p.hp=1;
}

const bossContactMul=()=>boss.arms==='garras'?1.5:1;   // Garras
// Aimed volley — arms decide the pattern, eyes decide the aim
function bossVolley(tgt){
  const bcx=boss.x+BW/2, bcy=boss.y+BH/2;
  let tx=tgt.x+PW/2, ty=tgt.y+PH/2;
  if(boss.eyes==='composto'){                      // lead the target
    const tt=Math.hypot(tx-bcx,ty-bcy)/5;
    tx+=tgt.vx*tt; ty+=clamp(tgt.vy,-4,4)*tt*.4;
  }
  const ang=Math.atan2(ty-bcy,tx-bcx), half=boss.hp<BMAXHP*.5;
  const das=boss.arms==='canhoes'?(half?[-.5,-.25,0,.25,.5]:[-.28,0,.28]):(half?[-.28,0,.28]:[0]);
  bossFire(bcx,bcy,ang,das,5,boss.arms==='tentaculos');
  sndBossShoot();
}
function bossFire(x,y,ang,das,spd,wave){
  boss.mouthT=Math.max(boss.mouthT,10);
  for(const da of das) bBullets.push({x,y,vx:Math.cos(ang+da)*spd,vy:Math.sin(ang+da)*spd,life:130,r:5,dmg:12,wave:wave?1:0,t:0});
}

function uBoss(){
  pushDust(boss.x,BW);
  if(boss.flash>0) boss.flash--;
  if(!boss.rising){
    boss.burstTimer++;
    if(boss.burstTimer>=BURST_INTERVAL&&boss.burstState==='NONE'){ boss.burstState='WINDUP'; boss.burstWindup=0; boss.burstTimer=0; sndBurst(); }
    if(boss.burstState==='WINDUP'){
      boss.burstWindup++; boss.vx*=.6;
      if(boss.burstWindup%6===0){ fx(boss.x+BW/2,boss.y+BH/2,10,'#ff0000',6,3); shake=Math.max(shake,4); }
      if(boss.burstWindup>=80){
        const bcx=boss.x+BW/2, bcy=boss.y+BH/2;
        for(let i=0;i<24;i++){ const a=(i/24)*Math.PI*2; bBullets.push({x:bcx,y:bcy,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8,life:380,r:8,dmg:24,burst:true}); }
        boss.burstState='NONE'; shake=30; fx(bcx,bcy,60,'#ff2020',10,4);
      }
    }
  }
  if(boss.rising){
    boss.y=lerp(boss.y,boss.riseTarget,.065); boss.x=lerp(boss.x,(W-BW)/2,.04);
    if(boss.y<=boss.riseTarget+2){ boss.rising=false; fx(boss.x+BW/2,boss.y+BH,25,lvl.bossAcc,5,3); shake=20; }
    boss.lastX=boss.x; return;
  }
  if(boss.onGround) boss.jumpsLeft=2;
  const alive=players.filter(p=>p.hp>0); if(!alive.length) return;
  const tgt=alive.reduce((a,b)=>Math.hypot(a.x-boss.x,a.y-boss.y)<Math.hypot(b.x-boss.x,b.y-boss.y)?a:b);
  const pcx=tgt.x+PW/2, pcy=tgt.y+PH/2;
  const bcx=boss.x+BW/2, bcy=boss.y+BH/2;
  boss.facing=pcx<bcx?-1:1;
  // Eye-driven attacks that resolve over several frames
  if(boss.mouthT>0) boss.mouthT--;
  if(boss.laserT>0){
    boss.laserT--; boss.vx*=.7;
    if(boss.laserT===0){
      // Ciclope: straight, fast line of bolts along the telegraphed angle
      for(let k=0;k<6;k++) bossFire(bcx+Math.cos(boss.laserAng)*k*12,bcy+Math.sin(boss.laserAng)*k*12,boss.laserAng,[0],9,false);
      shake=Math.max(shake,6); sndLaser();
    }
  }
  if(boss.pendingShot>0&&--boss.pendingShot===0) bossVolley(tgt);   // Gémeos: second shot of the pair
  if(boss.burstState!=='WINDUP'){
    boss.stateTimer--; boss.atkCD--; boss.jumpCD--;
    const moved=Math.abs(boss.x-boss.lastX);
    if(moved<.4) boss.stuckTimer++; else boss.stuckTimer=0;
    boss.lastX=boss.x;
    if(boss.stuckTimer>25){
      boss.stuckTimer=0;
      if(boss.jumpsLeft>0){ boss.vy=PJMP*.88; boss.jumpsLeft--; fx(boss.x+BW/2,boss.y+BH,10,lvl.bossAcc,4,2); }
      else { boss.chargeDir*=-1; boss.state='JUMP'; boss.stateTimer=rnd(40,80); boss.jumpCD=0; }
    }
    if(boss.stateTimer<=0){
      const r=Math.random(), rage=boss.hp<BMAXHP*.4;
      if(r<.28) boss.state='WALK'; else if(r<.50) boss.state='CHARGE'; else if(r<(rage?.65:.70)) boss.state='JUMP'; else boss.state='SHOOT';
      if(boss.legs==='aranha'&&boss.state==='JUMP') boss.state='CHARGE';   // spiders don't leap, they rush
      boss.stateTimer=rnd(50,110); boss.chargeDir=boss.facing;
      if(boss.state==='SHOOT') boss.atkCD=0;
    }
    if(boss.state==='WALK') boss.vx=lerp(boss.vx,boss.facing*2.4,.1);
    else if(boss.state==='CHARGE'){
      const cs=boss.legs==='aranha'?10.4:8;
      boss.vx=lerp(boss.vx,boss.chargeDir*cs,.15);
      if(boss.x<=TW+2||boss.x+BW>=W-TW-2){ boss.chargeDir*=-1; fx(boss.x+BW/2,boss.y+BH/2,8,lvl.bossAcc,3,2); }
    }
    else if(boss.state==='JUMP'){
      boss.vx=lerp(boss.vx,boss.facing*3.5,.12);
      if(boss.legs==='jatos'){
        // Jets: dive-bomb down onto the floor
        if(boss.jumpCD<=0&&!boss.slamming){ boss.vy=12; boss.jumpCD=70; boss.slamming=true; sndSlam(); }
      } else if(boss.onGround&&boss.jumpCD<=0){
        boss.vy=boss.legs==='bipede'?-15:-13.5; boss.jumpCD=45; shake=Math.max(shake,5); sndBossJump();
      }
    }
    else if(boss.state==='SHOOT'){
      boss.vx*=.82;
      if(boss.atkCD<=0&&boss.laserT<=0){
        if(boss.eyes==='ciclope'){
          boss.laserT=36; boss.laserAng=Math.atan2(pcy-bcy,pcx-bcx); boss.mouthT=36;
          boss.atkCD=boss.hp<BMAXHP*.3?48:66;
          sndCharge();
        } else {
          bossVolley(tgt);
          if(boss.eyes==='gemeos') boss.pendingShot=9;
          boss.atkCD=boss.hp<BMAXHP*.3?20:33;
          if(boss.eyes==='gemeos') boss.atkCD+=10;
        }
      }
    }
  }
  const wasGround=boss.onGround;
  boss.vx*=.87;
  if(boss.legs==='jatos'){
    boss.dropT=2;                                   // hovers through one-way platforms
    if(boss.slamming){
      boss.step(.6);
      if(boss.onGround){ boss.slamming=false; shake=Math.max(shake,14); fx(bcx,boss.y+BH,20,lvl.dust,5,3); sndLand(); }
    } else {
      const want=clamp(tgt.y-BH-36,TH*3,MH*TH-TH*2-BH);
      boss.vy=lerp(boss.vy,(want-boss.y)*.06,.12);
      boss.step(0);
      if(gFrame%3===0) fx(bcx+rnd(-8,8),boss.y+BH+4,1,'#ffb020',1.5,2);
    }
  } else {
    boss.step(.5);
    // Bípede: heavy landings shake the ground
    if(boss.legs==='bipede'&&boss.onGround&&!wasGround){ shake=Math.max(shake,12); fx(bcx,boss.y+BH,16,lvl.dust,4,3); sndLand(); }
  }
  boss.x=clamp(boss.x,TW+1,W-TW-BW-1);

  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i];
    if(boss.hits({x:b.x-2,y:b.y-2,w:5,h:5})){
      boss.hp=Math.max(0,boss.hp-(b.dmg||10)); pBullets.splice(i,1); boss.flash=3;
      fx(b.x,b.y,4,P.hpR,2,2); shake=Math.max(shake,2); sndBossHit();
      boss.hitCounter++;
      // Double frequency drops (every 5 hits = coins, every 5% = HP)
      if(boss.hitCounter%5===0&&boss.hp>0) spawnDrop(bcx+rnd(-22,22),bcy-rnd(5,20),'COIN');
      if(!boss.dmgDropped&&boss.hp<=BMAXHP*.5&&boss.hp>0){ boss.dmgDropped=true; spawnDrop(bcx,bcy-25,'DMGX2'); shake=Math.max(shake,25); bBullets.length=0; }
      const pct=Math.floor((BMAXHP-boss.hp)/(BMAXHP*.05)); // every 5%
      if(pct>boss.phaseDrops&&boss.hp>0){ boss.phaseDrops=pct; spawnDrop(bcx+rnd(-15,15),bcy,'HP'); shake=Math.max(shake,12); }
    }
  }
}

function uDead(){
  // Handle name input for highscore
  if(scoreFormActive){
    for(const c of justPressed){
      if(c==='Enter'&&playerNameInput.trim().length>0){
        const mode=numPlayers===1?'solo':'duo';
        const lvl2=levelNum, coins=players.reduce((s,p)=>s+p.coins,0);
        submitScore(playerNameInput.trim(),mode,lvl2,coins);
        scoreFormActive=false;
      } else if(c==='Backspace') playerNameInput=playerNameInput.slice(0,-1);
      else if(c.startsWith('Key')&&playerNameInput.length<20) playerNameInput+=c.replace('Key','');
      else if(c.startsWith('Digit')&&playerNameInput.length<20) playerNameInput+=c.replace('Digit','');
      else if(c==='Space'&&playerNameInput.length<20) playerNameInput+=' ';
    }
    return; // block other input while typing
  }
  if(!scoreFormActive&&!scoreSubmitted&&!scoreSubmitting){
    if(jp('KeyS')){ scoreFormActive=true; fetchLeaderboard(); return; }
  }
  if(jp('KeyR')){ resetPersist(); initLevel(false); }
  if(jp('Escape')||jp('KeyM')){ netLeave(); resetPersist(); stopMusic(); init(); }
}

function draw(){
  ctx.save();
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
  // Scale everything so game coords stay in 800×450 space, rendered at native DPI
  ctx.scale(SCALE*DPR, SCALE*DPR);
  if(shake>0) ctx.translate((Math.random()-.5)*shake*1.1,(Math.random()-.5)*shake*.7);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,P.bg); grad.addColorStop(1,'#0d051e');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  dStars();

  if(gState==='MENU') dMenu();
  else if(gState==='LOBBY') dLobby();
  else if(gState==='CIN_SPACE') dCinSpace();
  else if(gState==='CIN_ORBIT') dCinOrbit();
  else if(gState==='CIN_PAN'){ ctx.save(); ctx.translate(-camX,0); dMap(); ctx.restore(); dCinBars('SUPERFÍCIE DE KETH-9','ZONA SEGURA: NENHUMA'); }
  else if(gState==='CIN_CRASH'){ dMap(); dDustPiles(); dCrash(); dCinBars('CONTROLO PERDIDO','IMPACTO IMINENTE!'); }
  else if(gState==='PLAY'||gState==='DEAD'){
    dMap(); dDustPiles();
    for(const d of drops) dDrop(d);
    for(const b of bBullets) dBBullet(b);
    for(const b of pBullets) dPBullet(b);
    if(bossSpawned&&boss) dBoss();
    for(const p of players) dPlayer(p);
    dHUD();
  }
  else if(gState==='EXTRACT'){
    dMap(); dDustPiles();
    for(const p of players) dPlayer(p);
    dExtractScene();
  }
  else if(gState==='WARP'){
    dWarpScene();
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/22)*.9;
    ctx.fillStyle=p.col; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  if(gState==='DEAD') dDead();
  dNetOverlay();
  dCRTOverlay();
  dConsole();
  ctx.restore();
}

function dStars(){
  for(const s of stars){
    ctx.globalAlpha=.3+s.b*.7*(.8+.2*Math.sin(gFrame*.04+s.x));
    ctx.fillStyle=P.star; ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
}

// ── ZX SPECTRUM LOADING BORDER (menu) ────────────────────
function dZXBorder(){
  const BW=46; // border width px (game coords)
  const SH=8;  // stripe height
  // ZX classic colours: bright yellow and deep blue
  const COL=['#FFE600','#0007CF'];
  const nStripes=Math.ceil(H/SH)+2;
  const phase=Math.floor(gFrame/4)%2; // slow alternating animation
  for(let i=0;i<nStripes;i++){
    const y=i*SH;
    const c=COL[(i+phase)%2];
    ctx.fillStyle=c;
    ctx.fillRect(0,y,BW,SH);          // left border
    ctx.fillRect(W-BW,y,BW,SH);       // right border
    ctx.fillRect(BW,y,W-BW*2,Math.min(SH,1)); // top/bottom 1px grid line (subtle)
  }
  // Top and bottom border strips
  for(let i=0;i<Math.ceil(BW/SH);i++){
    const x=i*SH;
    const c=COL[(i+phase)%2];
    ctx.fillStyle=c;
    ctx.fillRect(BW+x,0,SH,BW);       // top
    ctx.fillRect(BW+x,H-BW,SH,BW);   // bottom
  }
  // Black inner frame line separating border from content
  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  ctx.strokeRect(BW+1,BW+1,W-BW*2-2,H-BW*2-2);
  ctx.globalAlpha=1;
}

// ── CRT OVERLAY: vignette + RGB fringe + rounded mask ────
function dCRTOverlay(){
  // 1. Vignette — stronger at corners
  const vig=ctx.createRadialGradient(W*.5,H*.5,H*.28,W*.5,H*.5,H*.88);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(0.65,'rgba(0,0,0,0.08)');
  vig.addColorStop(1,'rgba(0,0,0,0.52)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

  // 2. RGB chromatic aberration at borders — red left, blue right
  const rgbW=70;
  const redG=ctx.createLinearGradient(0,0,rgbW,0);
  redG.addColorStop(0,'rgba(255,0,20,0.055)');
  redG.addColorStop(1,'rgba(255,0,20,0)');
  ctx.fillStyle=redG; ctx.fillRect(0,0,rgbW,H);

  const blueG=ctx.createLinearGradient(W,0,W-rgbW,0);
  blueG.addColorStop(0,'rgba(0,30,255,0.055)');
  blueG.addColorStop(1,'rgba(0,30,255,0)');
  ctx.fillStyle=blueG; ctx.fillRect(W-rgbW,0,rgbW,H);

  // 3. Rounded corner mask — CRT screen shape
  const R=18;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.roundRect(0,0,W,H,R);
  ctx.fill('evenodd');

  ctx.globalAlpha=1;
}

// ════════════════════════════════════════════════════════
//  SCI-FI FRAME — industrial military button style
//  (ref: dark frame, amber accent lines, corner brackets,
//   deep red panel, pulsing LED — as per design reference)
// ════════════════════════════════════════════════════════
function dSciFrame(x,y,w,h,opts={}){
  // opts: {selected, owned, col, pulse, ledCol, flat}
  const sel=opts.selected||false;
  const owned=opts.owned||false;
  const accentCol=owned?'#20a040': sel?'#d07010':'#603808';
  const ledR=opts.ledCol||(owned?'#20ff50':sel?'#ff3010':'#441008');
  const p=sel?(0.7+Math.sin(gFrame*.14)*.3):0;

  // ── Outer shell (very dark, almost black) ──────────────
  ctx.fillStyle='#090a0f'; ctx.fillRect(x,y,w,h);

  // ── Amber/accent horizontal lines top + bottom ─────────
  ctx.fillStyle=accentCol;
  ctx.fillRect(x+12,y+1,w-24,2);          // top line
  ctx.fillRect(x+12,y+h-3,w-24,2);        // bottom line
  // thinner inner reflection
  ctx.fillStyle=sel?'rgba(220,110,20,.25)':'rgba(80,40,8,.18)';
  ctx.fillRect(x+14,y+4,w-28,1);
  ctx.fillRect(x+14,y+h-5,w-28,1);

  // ── Corner bracket pieces ──────────────────────────────
  const cb=10; // bracket size
  const cInner=5;
  const cbCol='#14151c';
  const cDot=sel?'#403020':'#1c1c26';
  for(const [cx2,cy2] of [[x,y],[x+w-cb,y],[x,y+h-cb],[x+w-cb,y+h-cb]]){
    ctx.fillStyle=cbCol; ctx.fillRect(cx2,cy2,cb,cb);
    ctx.fillStyle=cDot;  ctx.fillRect(cx2+2,cy2+2,cInner,cInner);
    // accent dot
    ctx.fillStyle=accentCol; ctx.fillRect(cx2+3,cy2+3,3,3);
  }

  // ── Side rails with rivets ─────────────────────────────
  ctx.fillStyle='#0d0e16';
  ctx.fillRect(x,y+cb,5,h-cb*2);
  ctx.fillRect(x+w-5,y+cb,5,h-cb*2);
  ctx.fillStyle=sel?'#604020':'#252530';
  for(let ry=y+cb+4;ry<y+h-cb-2;ry+=7){
    ctx.fillRect(x+1,ry,3,2);
    ctx.fillRect(x+w-4,ry,3,2);
  }

  // ── LED status indicator (top-right area) ─────────────
  const ledX=x+w-8, ledY=y+6;
  if(sel){
    ctx.globalAlpha=p*.35;
    ctx.fillStyle=ledR; ctx.beginPath(); ctx.arc(ledX,ledY,6,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=ledR; ctx.beginPath(); ctx.arc(ledX,ledY,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(ledX-.8,ledY-.8,1,0,Math.PI*2); ctx.fill();

  // ── Small bottom-left status bar ───────────────────────
  ctx.fillStyle='#12131a'; ctx.fillRect(x+7,y+h-7,16,3);
  ctx.fillStyle=owned?'#20ff50':sel?accentCol:'#301808';
  ctx.fillRect(x+7,y+h-7,owned?16:sel?10:4,3);

  // ── Inner face panel ──────────────────────────────────
  const fx2=x+6, fy=y+5, fw=w-12, fh=h-10;
  const panelGrad=ctx.createLinearGradient(fx2,fy,fx2,fy+fh);
  if(owned){
    panelGrad.addColorStop(0,'#082012'); panelGrad.addColorStop(.4,'#0c2c18'); panelGrad.addColorStop(1,'#051a0e');
  } else if(sel){ // canBuy — green, available
    panelGrad.addColorStop(0,'#082e10'); panelGrad.addColorStop(.35,'#0e4018'); panelGrad.addColorStop(.65,'#0c3a14'); panelGrad.addColorStop(1,'#051a0a');
  } else { // locked — dark brownish
    panelGrad.addColorStop(0,'#1e0c10'); panelGrad.addColorStop(.5,'#260e12'); panelGrad.addColorStop(1,'#180a0c');
  }
  ctx.fillStyle=panelGrad; ctx.fillRect(fx2,fy,fw,fh);

  // Subtle horizontal scan texture on face
  ctx.fillStyle='rgba(0,0,0,0.07)';
  for(let sy=fy+1;sy<fy+fh;sy+=3) ctx.fillRect(fx2,sy,fw,1);

  // Top highlight strip on face
  ctx.fillStyle=sel?'rgba(40,220,80,.07)':'rgba(255,255,255,.025)';
  ctx.fillRect(fx2,fy,fw,2);

  // Inner border
  ctx.strokeStyle=sel?'rgba(30,200,70,.5)':owned?'rgba(20,160,50,.4)':'rgba(100,40,20,.2)';
  ctx.lineWidth=1;
  ctx.strokeRect(fx2+.5,fy+.5,fw-1,fh-1);

  ctx.globalAlpha=1;
  return {fx:fx2, fy, fw, fh}; // return face bounds for text placement
}

// ── MENU — 80s neon / synthwave VHS poster ──────────────
const MENU_HZ=176;                       // horizon line
// ── EARLY-90s FLAT-SHADED POLYGON 3D (menu) ─────────────
// Tiny renderer: rotate → perspective → back-face cull → painter's sort →
// flat shading quantised to a few bands, dark vector outline.
const PL={x:-.45,y:-.65,z:-.6};                   // light dir (toward the light)
{ const m=Math.hypot(PL.x,PL.y,PL.z); PL.x/=m; PL.y/=m; PL.z/=m; }
function mkIco(){
  const f=(1+Math.sqrt(5))/2, v=[];
  for(const a of [-1,1]) for(const b of [-1,1]){ v.push([0,a,b*f],[a,b*f,0],[b*f,0,a]); }
  const F=[], d2=(p,q)=>(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;
  for(let i=0;i<12;i++) for(let j=i+1;j<12;j++) for(let k=j+1;k<12;k++)
    if(Math.abs(d2(v[i],v[j])-4)<.01&&Math.abs(d2(v[j],v[k])-4)<.01&&Math.abs(d2(v[i],v[k])-4)<.01) F.push([i,j,k]);
  return {v,f:F,convex:true};
}
const POLY_MOON=mkIco();
// Our lander, as a low-poly wedge (nose +x, up −y)
const POLY_SHIP={convex:false,v:[
  [30,0,0],[-12,-7,0],[-14,3,16],[-14,3,-16],[-18,4,0],[-20,-14,0],[-8,-7,0],[-22,0,5],[-22,0,-5]],
  f:[[0,1,2],[0,3,1],[0,2,4],[0,4,3],[1,4,2],[1,3,4],[1,6,5],[1,5,6],[4,7,2],[4,3,8]]};
function polyDraw(model,cx,cy,scale,rx,ry,rz,hue,sat,opt={}){
  const cX=Math.cos(rx),sX=Math.sin(rx),cY=Math.cos(ry),sY=Math.sin(ry),cZ=Math.cos(rz),sZ=Math.sin(rz);
  const R=model.v.map(([x,y,z])=>{
    let y1=y*cX-z*sX, z1=y*sX+z*cX;           // X
    let x2=x*cY+z1*sY, z2=-x*sY+z1*cY;        // Y
    let x3=x2*cZ-y1*sZ, y3=x2*sZ+y1*cZ;       // Z
    return [x3,y3,z2];
  });
  const D=opt.dist||6;
  const P=R.map(([x,y,z])=>{ const k=D/(D+z/(opt.zs||1)); return [cx+x*scale*k, cy+y*scale*k]; });
  let mcx=0,mcy=0,mcz=0; for(const r of R){ mcx+=r[0]; mcy+=r[1]; mcz+=r[2]; }
  mcx/=R.length; mcy/=R.length; mcz/=R.length;   // part centre (for outward normals)
  const faces=[];
  model.f.forEach((fc,fi)=>{
    const [a,b,c]=fc.map(i=>R[i]);
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2], vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const nm=Math.hypot(nx,ny,nz)||1; nx/=nm; ny/=nm; nz/=nm;
    if(model.convex){
      const mx=(a[0]+b[0]+c[0])/3-mcx,my=(a[1]+b[1]+c[1])/3-mcy,mz=(a[2]+b[2]+c[2])/3-mcz;
      if(nx*mx+ny*my+nz*mz<0){ nx=-nx; ny=-ny; nz=-nz; }
      if(nz>0) return;                            // facing away
    } else if(nz>0){ nx=-nx; ny=-ny; nz=-nz; }    // open mesh: two-sided
    const zAvg=(a[2]+b[2]+c[2])/3;
    const Lt=opt.light||PL, nb=opt.bands||4;
    const lit=Math.max(0,nx*Lt.x+ny*Lt.y+nz*Lt.z);
    faces.push({fc,fi,z:zAvg,band:Math.round(lit*nb)/nb});   // a few flat bands — no smooth shading
  });
  faces.sort((p,q)=>q.z-p.z);
  ctx.lineJoin='round';
  for(const {fc,fi,band} of faces){
    let h=hue, sa=sat, l0=14;
    if(opt.tones&&model.tone){ const tn=opt.tones[model.tone[fi]]; h=tn[0]; sa=tn[1]; l0=tn[2]; }
    ctx.beginPath(); fc.forEach((i,k)=>k?ctx.lineTo(P[i][0],P[i][1]):ctx.moveTo(P[i][0],P[i][1])); ctx.closePath();
    const fc2=hsl(h+(band<.3?-15:0),sa,l0+band*(opt.lspan||48));
    ctx.fillStyle=fc2; ctx.fill();
    ctx.strokeStyle=opt.edgeSelf?fc2:(opt.edge||'#12031f'); ctx.lineWidth=opt.lw||1; ctx.stroke();
  }
  return P;
}
// More models: hostile cruiser (hull + bridge), and a geodesic planet with land/sea/ice tones
const POLY_CRUISER={convex:true,v:[[-70,0,0],[-30,-14,-24],[-30,-14,24],[-30,14,24],[-30,14,-24],[60,-18,-30],[60,-18,30],[60,16,30],[60,16,-30]],
  f:[[0,1,2],[0,2,3],[0,3,4],[0,4,1],[1,5,6],[1,6,2],[2,6,7],[2,7,3],[3,7,8],[3,8,4],[4,8,5],[4,5,1],[5,8,7],[5,7,6]]};
function mkBox(x0,y0,z0,x1,y1,z1){
  return {convex:true,v:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],
    f:[[0,1,2],[0,2,3],[4,6,5],[4,7,6],[0,4,5],[0,5,1],[3,2,6],[3,6,7],[0,3,7],[0,7,4],[1,5,6],[1,6,2]]};
}
const POLY_TOWER=mkBox(10,-34,-10,40,-14,10);
function planetNoise(x,y,z){
  return Math.sin(x*4.1+z*2.3)+Math.sin(y*5.3-x*1.7)+Math.cos(z*3.7+y*2.9)+.5*Math.sin(x*9.1+y*7.3+z*5.7);
}
function subdivSphere(m,levels){
  let v=m.v.map(p=>{ const l=Math.hypot(...p); return p.map(c=>c/l); }), f=m.f;
  for(let L=0;L<levels;L++){
    const cache={}, nf=[];
    const mid=(a,b)=>{ const k=a<b?a+'_'+b:b+'_'+a; if(cache[k]!==undefined) return cache[k];
      const p=[0,1,2].map(i=>(v[a][i]+v[b][i])/2), l=Math.hypot(...p); v.push(p.map(c=>c/l)); return cache[k]=v.length-1; };
    for(const [a,b,c] of f){ const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a); nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]); }
    f=nf;
  }
  const vn=v.map(p=>planetNoise(...p));
  v=v.map((p,i)=>{ const r=1+Math.max(0,vn[i]-.2)*.035; return p.map(c=>c*r); });   // continents stand proud
  const tone=f.map(fc=>{
    const n=(vn[fc[0]]+vn[fc[1]]+vn[fc[2]])/3, y=(v[fc[0]][1]+v[fc[1]][1]+v[fc[2]][1])/3;
    if(Math.abs(y)>.86) return 4;                       // ice caps
    return n<-.5?0:n<.2?1:n<.9?2:3;                     // deep sea, sea, land, highland
  });
  return {v,f,convex:true,tone};
}

function dSpaceBG(){

function hudBrackets(m,top,bot,col){
  ctx.strokeStyle=col||'rgba(41,243,255,.7)'; ctx.lineWidth=2;
  for(const [x,y,dx,dy] of [[m,top,1,1],[W-m,top,-1,1],[m,bot,1,-1],[W-m,bot,-1,-1]]){ neonLine(x,y,x+dx*22,y); neonLine(x,y,x,y+dy*22); }

function hudTarget(x,y,r,label,col){
  ctx.strokeStyle=col; ctx.lineWidth=1.5;
  for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ const x0=x+dx*r, y0=y+dy*r*.7; neonLine(x0,y0,x0-dx*9,y0); neonLine(x0,y0,x0,y0-dy*9); }
  ctx.lineWidth=1; ctx.fillStyle=col; ctx.font='14px VT323, monospace'; ctx.textAlign='left';

function hudGauge(x,y,label,v,col,warn){
  ctx.font='14px VT323, monospace'; ctx.textAlign='left';
  ctx.fillStyle=col; ctx.fillText(label,x,y);
  const blink=warn&&gFrame%30<15;
  for(let k=0;k<14;k++){ ctx.globalAlpha=k/14<v?(blink?.4:1):.16; ctx.fillRect(x+k*8,y+4,6,7); }
  ctx.globalAlpha=1;
}
function shipPlume(x,y,ang,len,heat){
  // Re-entry plasma: stacked flickering cones trailing behind the ship
  const bx=-Math.cos(ang), by=-Math.sin(ang), px=-by, py=bx;
  [['#ff2f8e',1,1],['#ff9b3a',.75,.7],['#fff46a',.5,.4]].forEach(([c,lm,wm])=>{
    const L=len*lm*(.85+Math.random()*.3), w=12*wm;
    ctx.globalAlpha=heat*.85; ctx.fillStyle=c; ctx.beginPath();
    ctx.moveTo(x-bx*10+px*w,y-by*10+py*w); ctx.lineTo(x+bx*L,y+by*L); ctx.lineTo(x-bx*10-px*w,y-by*10-py*w); ctx.closePath(); ctx.fill();
  });
  ctx.globalAlpha=1;
}

// HUD panel: long-range bio-scan of the level's boss — silhouette with glowing eyes,
// name decoding letter by letter, then what it does
function dBossScan(x,y,w,h,t){
  const parts=nextBossParts; if(!parts) return;
  const bh=lvl.bossHue, acc=hsl(bh+180,95,60), eye=hsl(bh+180,90,72);
  const open=clamp(t/12,0,1);
  ctx.save();
  ctx.globalAlpha=open;
  ctx.fillStyle='rgba(5,0,18,.86)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=acc; ctx.globalAlpha=open*.7; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.globalAlpha=open; ctx.fillStyle=acc; ctx.fillRect(x,y,w,2);
  ctx.font='14px VT323, monospace'; ctx.textAlign='left';
  ctx.fillStyle=t%40<28?acc:'#ff2f8e'; ctx.fillText('SINAL BIOLÓGICO · SUPERFÍCIE',x+8,y+15);
  // silhouette: body in near-black boss tones, eyes and glow cells lit
  const blink=t%120<6;
  const g=composeBoss(parts,0,blink,false,-1);
  const sil={o:hsl(bh,40,5),d:hsl(bh,45,10),m:hsl(bh,45,14),l:hsl(bh,45,19),s:hsl(bh,45,24),
             a:acc,e:eye,p:'#1a0008',w:hsl(bh,25,28),f:acc};
  const ids=BOSS_ORDER.map(k=>parts[k].id).join(',');
  const spr=bossSprite(g,sil,`scan|${ids}|${bh}|${blink?1:0}`);
  const sx=x+10, sy=y+22, sw=spr.width, sh=spr.height;
  const rev=Math.floor(clamp((t-8)/90,0,1)*sh);
  ctx.fillStyle='#0b0418'; ctx.fillRect(sx-2,sy-2,sw+4,sh+4);
  if(rev>0) ctx.drawImage(spr,0,0,sw,rev,sx,sy,sw,rev);
  for(let i=0;i<14;i++){                       // static over the part not decoded yet
    const ny=sy+rev+Math.random()*(sh-rev); if(ny>=sy+sh) continue;
    ctx.fillStyle=Math.random()<.5?'rgba(255,255,255,.18)':hsl(bh+180,60,40); ctx.fillRect(sx+Math.random()*sw,ny,rnd(2,8),1);
  }
  if(rev<sh){ ctx.fillStyle=acc; ctx.fillRect(sx-2,sy+rev,sw+4,1); }
  // name, decoded letter by letter
  const name=bossName(parts), n=Math.floor(clamp((t-30)/80,0,1)*name.length);
  let shown=name.slice(0,n);
  for(let i=n;i<name.length;i++) shown+=name[i]===' '?' ':SCAN_GLYPHS[rnd(0,SCAN_GLYPHS.length)];
  const tx=sx+sw+12;
  ctx.font='17px VT323, monospace'; ctx.fillStyle=n>=name.length?'#ffffff':'#bba8d8';
  const words=shown.split(' '), line1=words[0], line2=words.slice(1).join(' ');
  ctx.fillText(line1,tx,y+38); ctx.fillText(line2,tx,y+54);
  // traits
  const rows=[['MOBILIDADE',SCAN_TRAITS.legs[parts.legs.id]],['ARMAS',SCAN_TRAITS.arms[parts.arms.id]],['SENSORES',SCAN_TRAITS.eyes[parts.eyes.id]]];
  ctx.font='14px VT323, monospace';
  rows.forEach(([k,v],i)=>{
    if(t<115+i*18) return;
    ctx.fillStyle='#6a6890'; ctx.fillText(k,tx,y+74+i*14);
    ctx.fillStyle='#7fe9ff'; ctx.fillText(v,tx+70,y+74+i*14);
  });
  if(t>175&&t%30<20){ ctx.fillStyle='#ff4040'; ctx.fillText('AMEAÇA: EXTREMA',tx,y+h-8); }
  ctx.restore();
}

// ── WARP SCENE + STORE OVERLAY ────────────────────────────
function dWarpScene(){
  // Black background
  ctx.fillStyle='#000008'; ctx.fillRect(0,0,W,H);
  // Warp star streaks
  const speed=Math.min(1,(warpTimer/40));
  for(const s of warpStars){
    const len=s.len*speed+2;
    const alpha=.2+speed*.7;
    ctx.globalAlpha=alpha;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+len,s.y); ctx.stroke();
    // Colour tint at high speed
    if(speed>.6){
      ctx.strokeStyle='#a0c0ff'; ctx.lineWidth=.5;
      ctx.beginPath(); ctx.moveTo(s.x-2,s.y-1); ctx.lineTo(s.x+len*.6,s.y-1); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  // Store overlay (after 1s)
  if(storeTimer>0) dStore();
}
